<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Farmer Login | KisanSetu</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-left">

        <div class="brand">
            🌾 Kisan<span>Setu</span>
        </div>

        <h1>Welcome Back 👋</h1>

        <p>
            Login to manage your procurement slots,
            queue and payment status.
        </p>

        <div class="benefits">
            <p>✓ Track Your Token</p>
            <p>✓ Check Queue Position</p>
            <p>✓ View Procurement Status</p>
            <p>✓ Track Payments</p>
        </div>

    </div>


    <div class="auth-card">

        <h2>Farmer Login</h2>

        <p class="subtitle">
            Login to your account
        </p>

        <form id="loginForm">

            <label>Mobile Number</label>

            <input
                type="tel"
                id="loginMobile"
                placeholder="Enter mobile number"
                maxlength="10"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter password"
                required
            >

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <p class="bottom-text">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</div>

<script src="auth.js"></script>

</body>
</html>
